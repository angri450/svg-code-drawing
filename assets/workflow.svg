  <rect x="272.0" y="150.0" width="190.0" height="84.0" rx="10.0" fill="#ffffff" stroke="#d1d5db" stroke-width="1.8" filter="url(#shadowSoft)"/>
  <text x="367.0" y="192.0" text-anchor="middle" class="node-title">分类</text>
  <text x="367.0" y="214.0" text-anchor="middle" class="node-sub">实物图还是逻辑图</text>
  <rect x="497.0" y="150.0" width="190.0" height="84.0" rx="10.0" fill="#ffffff" stroke="#d1d5db" stroke-width="1.8" filter="url(#shadowSoft)"/>
  <text x="592.0" y="192.0" text-anchor="middle" class="node-title">选风格</text>
  <text x="592.0" y="214.0" text-anchor="middle" class="node-sub">七套配色选一</text>
  <rect x="722.0" y="150.0" width="190.0" height="84.0" rx="10.0" fill="#ffffff" stroke="#d1d5db" stroke-width="1.8" filter="url(#shadowSoft)"/>
  <text x="817.0" y="192.0" text-anchor="middle" class="node-title">生成</text>
  <text x="817.0" y="214.0" text-anchor="middle" class="node-sub">模板起步写坐标</text>
  <rect x="160.0" y="390.0" width="190.0" height="84.0" rx="10.0" fill="#ffffff" stroke="#d1d5db" stroke-width="1.8" filter="url(#shadowSoft)"/>
  <text x="255.0" y="432.0" text-anchor="middle" class="node-title">校验</text>
  <text x="255.0" y="454.0" text-anchor="middle" class="node-sub">十类检查</text>
  <rect x="385.0" y="390.0" width="190.0" height="84.0" rx="10.0" fill="#ffffff" stroke="#d1d5db" stroke-width="1.8" filter="url(#shadowSoft)"/>
  <text x="480.0" y="432.0" text-anchor="middle" class="node-title">人机审查</text>
  <text x="480.0" y="454.0" text-anchor="middle" class="node-sub">点选元素改坐标</text>
  <rect x="610.0" y="390.0" width="190.0" height="84.0" rx="10.0" fill="#ffffff" stroke="#d1d5db" stroke-width="1.8" filter="url(#shadowSoft)"/>
  <text x="705.0" y="432.0" text-anchor="middle" class="node-title">交付</text>
  <text x="705.0" y="454.0" text-anchor="middle" class="node-sub">出 PNG 或 HTML</text>
</svg>